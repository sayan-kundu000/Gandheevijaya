services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: gandheevijaya-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && alembic -c backend/alembic.ini upgrade head"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: gandheevijaya-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_CORS_ORIGINS
        value: "https://gandheevijaya-frontend.onrender.com"

  # ---------------------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: gandheevijaya-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: gandheevijaya-backend
          property: host

databases:
  # ---------------------------------------------------------------------------
  # 3. PostgreSQL Relational Database
  # ---------------------------------------------------------------------------
  - name: gandheevijaya-db
    databaseName: gandheevijaya
    user: gandheevijaya_user
    plan: free
    region: singapore
